<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Flight scene inspection</title>
  <style>
    body { margin: 0; font: 14px system-ui; color: white; background: #182335; }
    canvas { width: 100vw; height: 100vh; display: block; }
    aside { position: fixed; top: 16px; right: 16px; width: 260px; padding: 16px; background: #111d30ec; border-radius: 12px; }
    label { display: block; margin: 10px 0; } input[type=range] { width: 100%; }
    button { padding: 8px; margin: 3px; } output { display: block; line-height: 1.6; }
  </style>
</head>
<body>
  <canvas id="preview"></canvas>
  <aside>
    <details open><summary>Development scene inspection</summary>
    <p><button id="city">City</button><button id="forest">Forest</button><button id="arms">Arms</button></p>
    <label>Left arm lift <input id="left" type="range" min="0" max="90" value="90" /></label>
    <label>Right arm lift <input id="right" type="range" min="0" max="90" value="90" /></label>
    <label>Arm extension <input id="reach" type="range" min="0.1" max="0.7" step="0.01" value="0.65" /></label>
    <label>Arm heading <input id="heading" type="range" min="-180" max="180" value="0" /></label>
    <label>Head yaw <input id="head" type="range" min="-180" max="180" value="0" /></label>
    <label>Look down / up <input id="pitch" type="range" min="-70" max="70" value="20" /></label>
    <label><input id="fly" type="checkbox" /> Fly using these poses</label>
    <output id="stats"></output>
    </details>
  </aside>
  <script type="module" src="./preview.ts"></script>
</body>
</html>
